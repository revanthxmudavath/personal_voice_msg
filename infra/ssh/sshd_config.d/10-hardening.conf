# infra/ssh/sshd_config.d/10-hardening.conf
#
# Copied to /etc/ssh/sshd_config.d/ on the real VPS per infra/RUNBOOK.md
# step 2. Apply this ONLY from a session already authenticated with
# key-based auth -- PasswordAuthentication no takes effect on the next
# `systemctl restart sshd`, and there is no recovery path for a locked-out
# password-only session other than the provider's console.
PasswordAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
