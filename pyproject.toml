[project]
name = "personal-voice-msg"
version = "0.1.0"
description = "Cloud-hosted personal voice message assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.2,<4",
    "pocket-tts>=2.1.0",
    "rapidfuzz>=3.14.5,<4",
    "soundfile>=0.14.0",
    "trafilatura>=2.1.0,<3",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "fast: pure logic and small file-backed SQLite tests",
    "integration: tests using real local or container dependencies",
    "live: tests using changing public web sources",
    "security: hostile input and trust-boundary tests",
    "e2e: real model, voice, audio, WAHA, and WhatsApp delivery tests",
    # Applied *in addition to* fast/integration/security, never instead of
    # one: these build this project's own image and/or bring the compose
    # stack up, take minutes, and need a working Docker daemon. CI runs
    # them in a dedicated job rather than inside the quality job's budget
    # (.github/workflows/ci.yml).
    "docker: builds this project's image or brings the compose stack up",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pocket_tts", "soundfile"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/personal_voice_msg"]
