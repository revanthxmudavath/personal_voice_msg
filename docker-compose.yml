# WAHA Core (MIT-licensed, NOWEB engine) -- see docs/task-logs/T15.md for
# the full design rationale. T18 owns broader container/network hardening
# (non-root, capability drops, read-only root, resource limits); this file
# covers only what T15 needs: WAHA reachable exclusively from this host, on
# loopback only, never a public port.
services:
  waha:
    # Pinned to a real, dated tag and its resolved digest -- never `latest`
    # (AGENTS.md requires pinned container digests).
    image: devlikeapro/waha:noweb-2026.7.2@sha256:33ecd1b782b2708db2ff1d366f51608889a036e76332dceae3fbbe3f10f2d75e
    restart: unless-stopped
    ports:
      # Loopback-only. Never 0.0.0.0 -- this is what makes "no public
      # dashboard or API exposure" true while still allowing the local QR
      # pairing step and the sender's own calls.
      - "127.0.0.1:3000:3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY must be set (see .env.example)}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:?WAHA_DASHBOARD_USERNAME must be set}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?WAHA_DASHBOARD_PASSWORD must be set}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:?WHATSAPP_SWAGGER_USERNAME must be set}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:?WHATSAPP_SWAGGER_PASSWORD must be set}
    volumes:
      # Named volume, not a repo bind mount -- WhatsApp session data must
      # never risk landing in Git (AGENTS.md).
      - waha_sessions:/app/.sessions

volumes:
  waha_sessions:
