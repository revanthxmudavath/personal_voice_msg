name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m fast
      - run: uv run pytest tests/integration/test_discovery_decoder_network.py
      - run: uv run pytest -m security
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python scripts/repository_policy.py all --root .

  t06-network-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose -p personal-voice-msg-t06 -f tests/security/t06/compose.yml config --quiet
      - run: docker compose -p personal-voice-msg-t06 -f tests/security/t06/compose.yml up --build --abort-on-container-exit --exit-code-from runner
      - if: always()
        run: docker compose -p personal-voice-msg-t06 -f tests/security/t06/compose.yml down --remove-orphans

  t07-discovery-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose -p personal-voice-msg-t07 -f tests/integration/t07/compose.yml config --quiet
      - run: docker compose -p personal-voice-msg-t07 -f tests/integration/t07/compose.yml up --build --abort-on-container-exit --exit-code-from runner
      - if: always()
        run: docker compose -p personal-voice-msg-t07 -f tests/integration/t07/compose.yml down --remove-orphans
